name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Binary & Setup Wizard
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install frontend dependencies & run typecheck
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run check

      - name: Run Go unit tests
        run: go test ./internal/...

      - name: Build Velora.exe & Velora-Setup.exe
        shell: pwsh
        run: ./scripts/build_installer.ps1

      - name: Upload Build Artifacts (SignPath / CI)
        uses: actions/upload-artifact@v4
        with:
          name: velora-windows-amd64
          path: |
            build/bin/Velora-Setup.exe
            build/bin/Velora.exe
          if-no-files-found: error

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/Velora-Setup.exe
          generate_release_notes: true
