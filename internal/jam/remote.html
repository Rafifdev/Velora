<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0e" />
  <title>Velora Jam</title>
  <style>
    :root,
    [data-theme="dark"] {
      color-scheme: dark;
      --md-sys-color-background: #0b0c0e;
      --md-sys-color-surface: #101113;
      --md-sys-color-surface-container-low: #141618;
      --md-sys-color-surface-container: #191b1e;
      --md-sys-color-surface-container-high: #22252a;
      --md-sys-color-surface-container-highest: #2c3037;
      --md-sys-color-on-surface: #f1f3f5;
      --md-sys-color-on-surface-variant: #c1c7ce;
      --md-sys-color-outline: #8b9198;
      --md-sys-color-outline-variant: rgba(193, 199, 206, 0.14);
      --md-sys-color-primary: #b8eaff;
      --md-sys-color-on-primary: #003546;
      --md-sys-color-primary-container: #004d64;
      --md-sys-color-tertiary: #ff9e64;
      --md-sys-color-on-tertiary: #341100;
      --md-sys-color-tertiary-container: #5c2400;
      --md-sys-color-state-hover: rgba(193, 199, 206, 0.08);
      --md-sys-color-state-active: rgba(193, 199, 206, 0.14);
      --md-elevation-2: 0 2px 6px 2px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.42);
    }

    [data-theme="light"] {
      color-scheme: light;
      --md-sys-color-background: #eff2f6;
      --md-sys-color-surface: #f6f8fa;
      --md-sys-color-surface-container-low: #f1f4f8;
      --md-sys-color-surface-container: #e8ecf2;
      --md-sys-color-surface-container-high: #dfe4ec;
      --md-sys-color-surface-container-highest: #d5dce6;
      --md-sys-color-on-surface: #101113;
      --md-sys-color-on-surface-variant: #424850;
      --md-sys-color-outline: #727882;
      --md-sys-color-outline-variant: rgba(16, 17, 19, 0.14);
      --md-sys-color-primary: #006684;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #c5ebff;
      --md-sys-color-tertiary: #ea6a1f;
      --md-sys-color-on-tertiary: #ffffff;
      --md-sys-color-tertiary-container: #ffe0ce;
      --md-sys-color-state-hover: rgba(16, 17, 19, 0.06);
      --md-sys-color-state-active: rgba(16, 17, 19, 0.11);
      --md-elevation-2: 0 2px 6px 2px rgba(16, 17, 19, 0.08), 0 1px 2px rgba(16, 17, 19, 0.06);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--md-sys-color-background);
      color: var(--md-sys-color-on-surface);
      font-family: "Plus Jakarta Sans", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-shell {
      height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      background: var(--md-sys-color-background);
      overflow: hidden;
      user-select: none;
    }

    /* Velora Titlebar */
    .titlebar {
      height: 50px;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 14px;
      gap: 12px;
    }
    .tb-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .tb-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--md-sys-color-tertiary) 92%, #ff5500) 0%, color-mix(in srgb, var(--md-sys-color-tertiary) 75%, #ffffff) 100%);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      flex-shrink: 0;
    }
    .tb-brand { font-size: 13.5px; font-weight: 800; letter-spacing: -0.01em; }
    .tb-search { width: min(440px, 46vw); position: relative; display: flex; align-items: center; }
    .tb-search-icon {
      position: absolute;
      left: 13px;
      color: var(--md-sys-color-on-surface-variant);
      pointer-events: none;
      display: flex;
    }
    .tb-search-input {
      width: 100%;
      height: 36px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      padding: 0 14px 0 38px;
      font-size: 12.5px;
      outline: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .tb-search-input:focus {
      background: var(--md-sys-color-surface-container-highest);
      border-color: var(--md-sys-color-outline-variant);
    }
    .tb-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
      font-size: 11px;
      font-weight: 600;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--md-sys-color-outline); }
    .status-pill.ok { color: #4ade80; }
    .status-pill.ok .status-dot { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
    .m3-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 0;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .m3-icon-btn:hover { background: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-on-surface); }

    /* Mobile Tabs */
    .mobile-tabs { display: none; gap: 6px; padding: 0 8px 6px; flex-shrink: 0; }
    .tab-btn {
      flex: 1;
      height: 34px;
      border: 0;
      border-radius: 999px;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface-variant);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--md-sys-color-on-surface); color: var(--md-sys-color-surface); }

    /* Velora 3-Pane Borderless Layout */
    .workspace { flex: 1; min-height: 0; display: flex; gap: 8px; padding: 0 8px; }
    .sidebar {
      width: 224px;
      flex-shrink: 0;
      background: var(--md-sys-color-surface);
      border-radius: 8px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-btn {
      width: 100%;
      height: 40px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: background 0.14s ease, color 0.14s ease;
    }
    .nav-btn:hover { background: var(--md-sys-color-state-hover); color: var(--md-sys-color-on-surface); }
    .nav-btn.active { background: var(--md-sys-color-state-active); color: var(--md-sys-color-on-surface); font-weight: 700; }

    .main-pane {
      flex: 1;
      min-width: 0;
      min-height: 0;
      background: var(--md-sys-color-surface);
      border-radius: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Velora Hero Banner */
    .hero-banner {
      padding: 28px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--md-sys-color-tertiary) 30%, var(--md-sys-color-tertiary-container)) 0%, color-mix(in srgb, var(--md-sys-color-tertiary-container) 74%, var(--md-sys-color-surface-container-low)) 100%);
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 20px;
      flex-shrink: 0;
    }
    .hero-art {
      width: 120px;
      height: 120px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.42);
      background: linear-gradient(135deg, color-mix(in srgb, var(--md-sys-color-tertiary) 92%, #ff5500) 0%, color-mix(in srgb, var(--md-sys-color-tertiary) 75%, #ffffff) 52%, color-mix(in srgb, var(--md-sys-color-tertiary-container) 88%, #ffffff) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }
    .hero-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-info { min-width: 0; flex: 1; padding-bottom: 4px; }
    .hero-eyebrow {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--md-sys-color-tertiary);
    }
    .hero-title {
      margin: 4px 0 0;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      word-break: break-word;
    }
    .hero-sub { margin-top: 6px; font-size: 12.5px; color: var(--md-sys-color-on-surface-variant); }

    .main-body {
      flex: 1;
      padding: 20px 28px 28px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--md-sys-color-tertiary-container) 36%, var(--md-sys-color-surface)) 0%, var(--md-sys-color-surface) 220px);
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .lyrics-list { display: flex; flex-direction: column; gap: 8px; }
    .lyric-line {
      font-size: 18px;
      line-height: 1.5;
      font-weight: 600;
      color: color-mix(in srgb, var(--md-sys-color-on-surface) 38%, transparent);
      cursor: pointer;
      transition: color 0.16s ease, transform 0.16s ease;
    }
    .lyric-line:hover { color: color-mix(in srgb, var(--md-sys-color-on-surface) 75%, transparent); }
    .lyric-line.active { color: var(--md-sys-color-on-surface); font-weight: 800; transform: translateX(4px); }
    .lyric-plain { white-space: pre-wrap; font-size: 14px; line-height: 1.75; color: var(--md-sys-color-on-surface-variant); }

    /* Velora RightPanel */
    .right-pane {
      width: 320px;
      flex-shrink: 0;
      background: var(--md-sys-color-surface);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .rp-head {
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .rp-count { font-size: 11px; font-weight: 600; color: var(--md-sys-color-on-surface-variant); font-variant-numeric: tabular-nums; }
    .rp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 12px; }

    .track-list { display: flex; flex-direction: column; gap: 2px; }
    .track-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      transition: background 0.14s ease;
    }
    .track-row:hover { background: var(--md-sys-color-state-hover); }
    .track-row.current { background: var(--md-sys-color-state-active); }
    .track-hit {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      cursor: pointer;
    }
    .tr-idx { width: 20px; text-align: center; font-size: 11px; color: var(--md-sys-color-on-surface-variant); font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .track-row.current .tr-idx, .track-row.current .tr-title { color: var(--md-sys-color-tertiary); }
    .tr-meta { min-width: 0; flex: 1; }
    .tr-title { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tr-sub { font-size: 11px; color: var(--md-sys-color-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .tr-dur { font-size: 11px; color: var(--md-sys-color-on-surface-variant); font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .mini-btn {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
    }
    .mini-btn:hover { background: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-on-surface); }

    /* Velora Bottom PlayerBar */
    .playerbar {
      height: 82px;
      flex-shrink: 0;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr 1.6fr 1fr;
      align-items: center;
      gap: 16px;
      background: var(--md-sys-color-background);
    }
    .pb-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .pb-art {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--md-sys-color-surface-container-high);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-on-surface-variant);
    }
    .pb-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pb-meta { min-width: 0; }
    .pb-title { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pb-artist { font-size: 11.5px; color: var(--md-sys-color-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .pb-center { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
    .pb-controls { display: flex; align-items: center; gap: 10px; }
    .pb-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .pb-btn:hover { background: var(--md-sys-color-state-hover); color: var(--md-sys-color-on-surface); }
    .pb-btn.main-skip { color: var(--md-sys-color-on-surface); }
    .pb-btn.active { color: var(--md-sys-color-tertiary); }
    .pb-play {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 0;
      background: var(--md-sys-color-tertiary);
      color: var(--md-sys-color-on-tertiary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .pb-play:hover { filter: brightness(1.06); transform: scale(1.03); }
    .pb-seek { width: 100%; max-width: 540px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--md-sys-color-on-surface-variant); font-variant-numeric: tabular-nums; }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 999px;
      background: var(--md-sys-color-surface-container-highest);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--md-sys-color-on-surface);
    }
    .pb-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .vol-slider { max-width: 110px; }
    .vol-pct { font-size: 11px; color: var(--md-sys-color-on-surface-variant); width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }

    @media (max-width: 920px) {
      .sidebar { display: none; }
      .right-pane { width: 280px; }
    }
    @media (max-width: 760px) {
      .titlebar { grid-template-columns: auto 1fr auto; }
      .tb-brand { display: none; }
      .tb-search { width: 100%; }
      .mobile-tabs { display: flex; }
      .right-pane { width: 100%; }
      .mobile-hide { display: none !important; }
      .playerbar { height: auto; padding: 10px 12px 12px; grid-template-columns: 1fr; gap: 6px; }
      .pb-left, .pb-right { display: none; }
      .hero-banner { padding: 20px 18px; }
      .hero-art { width: 96px; height: 96px; }
      .hero-title { font-size: 20px; }
      .main-body { padding: 16px 18px 24px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="titlebar">
      <div class="tb-left">
        <span class="tb-logo">V</span>
        <span class="tb-brand">Velora Jam</span>
      </div>

      <form id="searchForm" class="tb-search">
        <span class="tb-search-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        <input id="searchInput" class="tb-search-input" type="search" placeholder="Cari lagu, artis, atau album..." autocomplete="off" />
      </form>

      <div class="tb-right">
        <div id="statusPill" class="status-pill">
          <span class="status-dot"></span>
          <span id="statusText">Menghubungkan</span>
        </div>
        <button id="themeBtn" type="button" class="m3-icon-btn" title="Ganti Tema" aria-label="Ganti Tema">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <nav class="mobile-tabs">
      <button class="tab-btn active" data-tab="now" type="button">Now Playing</button>
      <button class="tab-btn" data-tab="queue" type="button">Queue</button>
      <button class="tab-btn" data-tab="search" type="button">Cari</button>
    </nav>

    <div class="workspace">
      <aside class="sidebar">
        <button id="navNowBtn" class="nav-btn active" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
          <span>Now Playing</span>
        </button>
        <button id="navSearchBtn" class="nav-btn" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span>Jelajahi Lagu</span>
        </button>
      </aside>

      <main id="mainPane" class="main-pane">
        <div id="nowView">
          <section class="hero-banner">
            <div class="hero-art">
              <img id="heroCoverImg" class="hidden" alt="Album Cover" />
              <svg id="heroCoverFallback" width="44" height="44" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" />
              </svg>
            </div>
            <div class="hero-info">
              <div class="hero-eyebrow">Velora Jam • Remote</div>
              <h1 id="heroTitle" class="hero-title">Belum ada lagu diputar</h1>
              <div id="heroArtist" class="hero-sub">Velora Desktop</div>
            </div>
          </section>

          <div class="main-body">
            <h2 class="section-title"><span>Lyrics</span></h2>
            <div id="lyricsBox" class="lyrics-list">
              <div style="font-size:13px;color:var(--md-sys-color-on-surface-variant);">Lirik akan tampil di sini saat lagu diputar.</div>
            </div>
          </div>
        </div>

        <div id="searchView" class="main-body hidden" style="background:var(--md-sys-color-surface);">
          <h2 class="section-title">
            <span>Hasil Pencarian</span>
            <button id="backNowBtn" type="button" class="mini-btn" style="width:auto;padding:0 10px;font-size:11px;">Kembali</button>
          </h2>
          <div id="searchList" class="track-list">
            <div style="font-size:13px;color:var(--md-sys-color-on-surface-variant);">Ketik judul lagu atau nama artis di search bar atas.</div>
          </div>
        </div>
      </main>

      <aside id="queuePane" class="right-pane mobile-hide">
        <div class="rp-head">
          <span>Queue</span>
          <span id="queueCount" class="rp-count">0 lagu</span>
        </div>
        <div class="rp-body">
          <div id="queueList" class="track-list"></div>
        </div>
      </aside>
    </div>

    <footer class="playerbar">
      <div class="pb-left">
        <div class="pb-art">
          <img id="pbCoverImg" class="hidden" alt="Cover" />
          <svg id="pbCoverFallback" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" />
          </svg>
        </div>
        <div class="pb-meta">
          <div id="pbTitle" class="pb-title">Belum ada lagu diputar</div>
          <div id="pbArtist" class="pb-artist">Velora Desktop</div>
        </div>
      </div>

      <div class="pb-center">
        <div class="pb-controls">
          <button id="shuffleBtn" class="pb-btn" type="button" title="Shuffle" aria-label="Shuffle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
              <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
              <line x1="4" y1="4" x2="9" y2="9"/>
            </svg>
          </button>
          <button id="prevBtn" class="pb-btn main-skip" type="button" title="Sebelumnya" aria-label="Sebelumnya">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button id="playBtn" class="pb-play" type="button" title="Putar / Jeda" aria-label="Putar atau Jeda">
            <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button id="nextBtn" class="pb-btn main-skip" type="button" title="Berikutnya" aria-label="Berikutnya">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
          <button id="repeatBtn" class="pb-btn" type="button" title="Ulangi" aria-label="Ulangi">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
              <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
          </button>
        </div>

        <div class="pb-seek">
          <span id="posTime">0:00</span>
          <input id="seekRange" type="range" min="0" max="100" step="1" value="0" aria-label="Seek" />
          <span id="durTime">0:00</span>
        </div>
      </div>

      <div class="pb-right">
        <button id="muteBtn" class="pb-btn" type="button" title="Mute" aria-label="Mute">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
        <input id="volRange" class="vol-slider" type="range" min="0" max="100" step="1" value="80" aria-label="Volume" />
        <span id="volVal" class="vol-pct">80%</span>
      </div>
    </footer>
  </div>

  <script>
    const el = (id) => document.getElementById(id);
    const statusPill = el('statusPill');
    const statusText = el('statusText');
    const themeBtn = el('themeBtn');
    const searchForm = el('searchForm');
    const searchInput = el('searchInput');
    const mainPane = el('mainPane');
    const queuePane = el('queuePane');
    const navNowBtn = el('navNowBtn');
    const navSearchBtn = el('navSearchBtn');
    const backNowBtn = el('backNowBtn');
    const nowView = el('nowView');
    const searchView = el('searchView');
    const searchList = el('searchList');
    const heroCoverImg = el('heroCoverImg');
    const heroCoverFallback = el('heroCoverFallback');
    const pbCoverImg = el('pbCoverImg');
    const pbCoverFallback = el('pbCoverFallback');
    const heroTitle = el('heroTitle');
    const heroArtist = el('heroArtist');
    const pbTitle = el('pbTitle');
    const pbArtist = el('pbArtist');
    const lyricsBox = el('lyricsBox');
    const seekRange = el('seekRange');
    const posTime = el('posTime');
    const durTime = el('durTime');
    const playBtn = el('playBtn');
    const playIcon = el('playIcon');
    const pauseIcon = el('pauseIcon');
    const prevBtn = el('prevBtn');
    const nextBtn = el('nextBtn');
    const shuffleBtn = el('shuffleBtn');
    const repeatBtn = el('repeatBtn');
    const muteBtn = el('muteBtn');
    const volRange = el('volRange');
    const volVal = el('volVal');
    const queueCount = el('queueCount');
    const queueList = el('queueList');

    let isSeeking = false;
    let isVolChanging = false;
    let lastCoverKey = '';
    let lastTrackKey = '';
    let syncedLyrics = [];

    function fmt(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}:${r < 10 ? '0' : ''}${r}`;
    }

    themeBtn.onclick = () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    };

    function showMode(mode) {
      const isSearch = mode === 'search';
      nowView.classList.toggle('hidden', isSearch);
      searchView.classList.toggle('hidden', !isSearch);
      navNowBtn.classList.toggle('active', !isSearch);
      navSearchBtn.classList.toggle('active', isSearch);
    }

    function setMobileTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((b) => {
        b.classList.toggle('active', b.dataset.tab === tab);
      });
      if (tab === 'queue') {
        mainPane.classList.add('mobile-hide');
        queuePane.classList.remove('mobile-hide');
      } else {
        mainPane.classList.remove('mobile-hide');
        queuePane.classList.add('mobile-hide');
        showMode(tab === 'search' ? 'search' : 'now');
      }
    }

    navNowBtn.onclick = () => showMode('now');
    navSearchBtn.onclick = () => { showMode('search'); searchInput.focus(); };
    backNowBtn.onclick = () => setMobileTab('now');
    document.querySelectorAll('.tab-btn').forEach((b) => {
      b.onclick = () => setMobileTab(b.dataset.tab);
    });

    async function sendCmd(action, payload = {}) {
      try {
        await fetch(`/api/playback/${encodeURIComponent(action)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(typeof payload === 'number' ? { value: payload } : payload)
        });
      } catch (_) {}
    }

    async function loadLyrics() {
      try {
        const res = await fetch('/api/lyrics');
        const data = await res.json();
        syncedLyrics = Array.isArray(data.syncedLyrics) ? data.syncedLyrics : [];
        lyricsBox.innerHTML = '';
        if (syncedLyrics.length > 0) {
          syncedLyrics.forEach((line) => {
            const div = document.createElement('div');
            div.className = 'lyric-line';
            div.textContent = line.text || '♪';
            div.onclick = () => sendCmd('seek', line.timeSec);
            lyricsBox.appendChild(div);
          });
        } else if (data.plainLyrics) {
          const pre = document.createElement('div');
          pre.className = 'lyric-plain';
          pre.textContent = data.plainLyrics;
          lyricsBox.appendChild(pre);
        } else {
          lyricsBox.innerHTML = '<div style="font-size:13px;color:var(--md-sys-color-on-surface-variant);">Lirik belum tersedia untuk lagu ini.</div>';
        }
      } catch (_) {
        syncedLyrics = [];
      }
    }

    function updateActiveLyric(posSec) {
      if (!syncedLyrics.length) return;
      let activeIdx = -1;
      for (let i = 0; i < syncedLyrics.length; i++) {
        if (syncedLyrics[i].timeSec <= posSec + 0.35) activeIdx = i;
        else break;
      }
      lyricsBox.querySelectorAll('.lyric-line').forEach((node, idx) => {
        node.classList.toggle('active', idx === activeIdx);
      });
    }

    function render(state) {
      if (!state) return;
      const title = state.title || 'Belum ada lagu diputar';
      const sub = [state.artist, state.album].filter(Boolean).join(' • ') || 'Velora Desktop';
      heroTitle.textContent = title;
      heroArtist.textContent = sub;
      pbTitle.textContent = title;
      pbArtist.textContent = state.artist || 'Velora Desktop';

      const trackKey = `${state.trackId || 0}:${state.externalId || ''}:${state.title || ''}`;
      if (trackKey !== lastTrackKey) {
        lastTrackKey = trackKey;
        loadLyrics();
      }

      const coverKey = `${trackKey}:${state.coverUrl || ''}`;
      if (coverKey !== lastCoverKey) {
        lastCoverKey = coverKey;
        const src = state.coverUrl ? `/api/cover?v=${encodeURIComponent(coverKey)}` : '';
        [ [heroCoverImg, heroCoverFallback], [pbCoverImg, pbCoverFallback] ].forEach(([img, fb]) => {
          if (src) {
            img.src = src;
            img.classList.remove('hidden');
            fb.classList.add('hidden');
          } else {
            img.classList.add('hidden');
            fb.classList.remove('hidden');
          }
        });
      }

      playIcon.classList.toggle('hidden', !!state.isPlaying);
      pauseIcon.classList.toggle('hidden', !state.isPlaying);

      const dur = Math.max(0, Number(state.durationSec) || 0);
      const pos = Math.max(0, Math.min(dur || 0, Number(state.positionSec) || 0));
      if (!isSeeking) {
        seekRange.max = String(Math.max(1, Math.floor(dur)));
        seekRange.value = String(Math.floor(pos));
        posTime.textContent = fmt(pos);
      }
      durTime.textContent = fmt(dur);
      updateActiveLyric(pos);

      if (!isVolChanging) {
        const v = Math.max(0, Math.min(100, Math.round(Number(state.volume) ?? 80)));
        volRange.value = String(v);
        volVal.textContent = state.muted ? 'Mute' : `${v}%`;
      }
      muteBtn.classList.toggle('active', !!state.muted);
      shuffleBtn.classList.toggle('active', !!state.shuffle);
      repeatBtn.classList.toggle('active', state.repeatMode && state.repeatMode !== 'off');

      const q = Array.isArray(state.queue) ? state.queue : [];
      queueCount.textContent = `${q.length} lagu`;
      queueList.innerHTML = '';
      q.forEach((item, idx) => {
        const isCur = (state.trackId && item.trackId === state.trackId) || (state.externalId && item.externalId === state.externalId);
        const row = document.createElement('div');
        row.className = `track-row${isCur ? ' current' : ''}`;

        const hit = document.createElement('button');
        hit.type = 'button';
        hit.className = 'track-hit';
        hit.onclick = () => sendCmd('play-index', idx);
        hit.innerHTML = `<span class="tr-idx">${idx + 1}</span><span class="tr-meta"><div class="tr-title"></div><div class="tr-sub"></div></span><span class="tr-dur">${fmt(item.durationSec)}</span>`;
        hit.querySelector('.tr-title').textContent = item.title || 'Untitled';
        hit.querySelector('.tr-sub').textContent = item.artist || 'Unknown Artist';

        const rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'mini-btn';
        rm.textContent = '×';
        rm.title = 'Hapus dari antrean';
        rm.onclick = () => sendCmd('remove-index', idx);

        row.appendChild(hit);
        row.appendChild(rm);
        queueList.appendChild(row);
      });
    }

    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = searchInput.value.trim();
      if (!q) return;
      showMode('search');
      if (window.innerWidth <= 760) setMobileTab('search');
      searchList.innerHTML = '<div style="font-size:13px;color:var(--md-sys-color-on-surface-variant);">Mencari…</div>';
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const items = await res.json();
        searchList.innerHTML = '';
        if (!Array.isArray(items) || items.length === 0) {
          searchList.innerHTML = '<div style="font-size:13px;color:var(--md-sys-color-on-surface-variant);">Tidak ada hasil ditemukan.</div>';
          return;
        }
        items.forEach((item, idx) => {
          const row = document.createElement('div');
          row.className = 'track-row';

          const hit = document.createElement('button');
          hit.type = 'button';
          hit.className = 'track-hit';
          hit.onclick = () => sendCmd('play-track', item);
          hit.innerHTML = `<span class="tr-idx">${idx + 1}</span><span class="tr-meta"><div class="tr-title"></div><div class="tr-sub"></div></span><span class="tr-dur">${fmt(item.durationSec)}</span>`;
          hit.querySelector('.tr-title').textContent = item.title || 'Untitled';
          hit.querySelector('.tr-sub').textContent = [item.artist, item.album].filter(Boolean).join(' • ') || 'Unknown Artist';

          const addBtn = document.createElement('button');
          addBtn.type = 'button';
          addBtn.className = 'mini-btn';
          addBtn.textContent = '+';
          addBtn.title = 'Tambah ke antrean';
          addBtn.onclick = () => sendCmd('add-track', item);

          row.appendChild(hit);
          row.appendChild(addBtn);
          searchList.appendChild(row);
        });
      } catch (_) {
        searchList.innerHTML = '<div style="font-size:13px;color:#f87171;">Pencarian gagal.</div>';
      }
    });

    [ [heroCoverImg, heroCoverFallback], [pbCoverImg, pbCoverFallback] ].forEach(([img, fb]) => {
      img.onerror = () => {
        img.classList.add('hidden');
        fb.classList.remove('hidden');
      };
    });

    playBtn.onclick = () => sendCmd('toggle');
    prevBtn.onclick = () => sendCmd('prev');
    nextBtn.onclick = () => sendCmd('next');
    shuffleBtn.onclick = () => sendCmd('shuffle');
    repeatBtn.onclick = () => sendCmd('repeat');
    muteBtn.onclick = () => sendCmd('mute');

    seekRange.addEventListener('pointerdown', () => { isSeeking = true; });
    seekRange.addEventListener('input', () => { posTime.textContent = fmt(Number(seekRange.value)); });
    seekRange.addEventListener('change', () => {
      isSeeking = false;
      sendCmd('seek', Number(seekRange.value));
    });

    volRange.addEventListener('pointerdown', () => { isVolChanging = true; });
    volRange.addEventListener('input', () => { volVal.textContent = `${volRange.value}%`; });
    volRange.addEventListener('change', () => {
      isVolChanging = false;
      sendCmd('volume', Number(volRange.value));
    });

    fetch('/api/state').then((r) => r.json()).then(render).catch(() => {});

    const es = new EventSource('/api/events');
    es.onopen = () => {
      statusText.textContent = 'Terhubung';
      statusPill.classList.add('ok');
    };
    es.onerror = () => {
      statusText.textContent = 'Menghubungkan…';
      statusPill.classList.remove('ok');
    };
    es.addEventListener('state', (ev) => {
      try { render(JSON.parse(ev.data)); } catch (_) {}
    });
  </script>
</body>
</html>
